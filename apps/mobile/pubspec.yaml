name: playgrid_mobile
description: PlayGrid Club mobile app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  # Pinned because supabase_flutter pulls in app_links transitively and
  # versions 6.4.x switched to the new Flutter Gradle Plugin contract,
  # which requires Flutter >= 3.27. Stay on 6.3.x until the host SDK is
  # bumped.
  app_links: ">=6.0.0 <6.4.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
